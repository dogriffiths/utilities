<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loch Ness Analysis Replay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one centred chat column on a dark stage; prompt types into a composer, sends, searches run, answer streams. */
:root {
  --bg: #0e1216;
  --panel: #161b21;
  --raise: #1c232b;
  --line: #28303a;
  --text: #e7eaee;
  --muted: #8a95a2;
  --accent: #55c4ba;
  --good: #3fb97f;
  --bad: #e5636b;
  --neutral: #7d8794;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { font-size: 18px; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.6;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
a { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }

/* top bar */
.topbar {
  flex: none;
  display: flex; align-items: center; gap: .6rem;
  padding: .7rem 1.2rem;
  border-bottom: 1px solid var(--line);
  color: var(--muted);
  font-size: .78rem;
  letter-spacing: .01em;
}
.topbar .dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--accent); }

/* thread */
#scroll { flex: 1; overflow-y: auto; scrollbar-width: none; }
#scroll::-webkit-scrollbar { display: none; }
#thread { max-width: 46rem; margin: 0 auto; padding: 2rem 1.2rem 5rem; display: flex; flex-direction: column; gap: 1.8rem; }

.msg.user { align-self: flex-end; max-width: 85%; background: var(--raise); border: 1px solid var(--line); padding: .8rem 1rem; border-radius: 1rem; border-bottom-right-radius: .3rem; animation: rise .35s ease both; }
.msg.ai { display: grid; grid-template-columns: 1.8rem 1fr; gap: .9rem; }
.avatar { width: 1.8rem; height: 1.8rem; border-radius: 50%; background: color-mix(in srgb, var(--accent) 18%, var(--panel)); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); display: grid; place-items: center; font-size: .75rem; font-weight: 600; color: var(--accent); margin-top: .1rem; }
.body { min-width: 0; display: flex; flex-direction: column; gap: .9rem; }

.blk { animation: rise .3s ease both; }
.body p, .body ul, .body ol, .body h2 { margin: 0; }
.body h2 { font-size: 1.15rem; font-weight: 600; margin-top: .9rem; text-wrap: balance; }
.body ul, .body ol { padding-left: 1.3rem; display: flex; flex-direction: column; gap: .55rem; }
.body li::marker { color: var(--muted); }
.body strong { font-weight: 600; color: #fff; }
.small { color: var(--muted); }

/* streaming caret */
.cur::after { content: ""; display: inline-block; width: .5em; height: 1.05em; margin-left: 2px; background: var(--accent); vertical-align: -.18em; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }

/* thinking */
.thinking { display: flex; align-items: center; gap: .55rem; color: var(--muted); font-size: .85rem; }
.thinking i { width: .4rem; height: .4rem; border-radius: 50%; background: var(--accent); display: inline-block; animation: pulse 1.2s infinite; }
.thinking i:nth-child(2) { animation-delay: .15s; }
.thinking i:nth-child(3) { animation-delay: .3s; }

/* search group */
.tools { border: 1px solid var(--line); background: var(--panel); border-radius: .7rem; overflow: hidden; animation: rise .3s ease both; }
.tools-head { display: flex; align-items: center; gap: .6rem; padding: .6rem .9rem; font-size: .85rem; color: var(--text); }
.tools-head .count { color: var(--muted); margin-left: auto; font-family: var(--font-mono); font-size: .75rem; }
.tools-list { border-top: 1px solid var(--line); padding: .35rem 0; }
.qrow { display: flex; align-items: center; gap: .6rem; padding: .32rem .9rem; font-family: var(--font-mono); font-size: .76rem; color: var(--muted); animation: rise .25s ease both; }
.qrow .q { color: var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qrow .dom { margin-left: auto; opacity: 0; transition: opacity .3s; white-space: nowrap; }
.qrow.ok .dom { opacity: 1; }
.mark { flex: none; width: .9rem; height: .9rem; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; position: relative; }
.ok > .mark, .ok .mark { animation: none; border: none; background: var(--accent); }
.ok > .mark::after, .tools-head.ok .mark::after { content: ""; position: absolute; left: 31%; top: 14%; width: 25%; height: 50%; border: solid var(--bg); border-width: 0 2px 2px 0; transform: rotate(45deg); }

.fail .mark { animation: none; border: none; background: var(--bad); }
.fail .mark::before, .fail .mark::after { content: ""; position: absolute; left: 22%; top: calc(50% - 1px); width: 56%; height: 2px; background: var(--bg); transform: rotate(45deg); }
.fail .mark::after { transform: rotate(-45deg); }
.qrow.fail .dom { opacity: 1; color: var(--bad); }

/* table */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: .7rem; background: var(--panel); }
table { width: 100%; border-collapse: collapse; font-size: .8rem; line-height: 1.4; }
th, td { padding: .6rem .75rem; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
th { font-weight: 600; color: var(--muted); font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; background: var(--raise); }
tr:last-child td { border-bottom: none; }
td:first-child { width: 38%; }
td.cell, td.ev { opacity: 0; transform: translateY(4px); transition: opacity .35s, transform .35s; }
td.show { opacity: 1; transform: none; }
.code { display: inline-block; min-width: 1.6em; text-align: center; font-family: var(--font-mono); font-weight: 500; font-size: .72rem; padding: .05rem .3rem; border-radius: .3rem; margin-right: .35rem; }
.code.c  { color: var(--good); background: color-mix(in srgb, var(--good) 16%, transparent); }
.code.cc { color: #0e1216; background: var(--good); }
.code.i  { color: var(--bad); background: color-mix(in srgb, var(--bad) 16%, transparent); }
.code.ii { color: #0e1216; background: var(--bad); }
.code.n  { color: var(--neutral); background: color-mix(in srgb, var(--neutral) 18%, transparent); }
tr.new td { background: color-mix(in srgb, var(--accent) 9%, transparent); }
tr.new td.ev { font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
tr.sum td { background: var(--raise); font-weight: 600; border-top: 1px solid var(--line); }

/* composer */
.composer-wrap { flex: none; padding: 0 1.2rem 1.4rem; }
.composer { max-width: 46rem; margin: 0 auto; display: flex; align-items: flex-end; gap: .8rem; background: var(--panel); border: 1px solid var(--line); border-radius: 1rem; padding: .8rem .8rem .8rem 1.1rem; }
.composer .txt { flex: 1; min-height: 1.6rem; max-height: 9rem; overflow: hidden; font-size: .95rem; white-space: pre-wrap; word-break: break-word; }
.composer .txt:empty::before { content: attr(data-ph); color: var(--muted); }
.send { flex: none; width: 2.1rem; height: 2.1rem; border-radius: .6rem; border: none; background: var(--raise); color: var(--muted); display: grid; place-items: center; transition: background .2s, color .2s, transform .15s; }
.send.ready { background: var(--accent); color: #0e1216; }
.send.press { transform: scale(.88); }
.send svg { width: 1rem; height: 1rem; }

/* stage = top 90% (what you record), dock = bottom 10% (crop it off) */
.stage { flex: 0 0 90%; height: 90%; min-height: 0; display: flex; flex-direction: column; }
.dock { flex: 0 0 10%; height: 10%; min-height: 0; display: flex; align-items: center; gap: 1.2rem; padding: 0 1.2rem; background: #0a0d10; border-top: 2px solid var(--accent); overflow: hidden; }
.dock .intro { min-width: 0; flex: 1; }
.dock .intro strong { display: block; font-size: .85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock .intro span { display: block; color: var(--muted); font-size: .68rem; line-height: 1.35; }
.dock .keys { font-family: var(--font-mono); font-size: .62rem; color: var(--muted); line-height: 1.5; white-space: nowrap; }
.dock .btns { display: flex; align-items: center; gap: .4rem; flex: none; }
.dock button, .dock select { font: inherit; font-size: .75rem; color: var(--text); background: var(--raise); border: 1px solid var(--line); border-radius: .45rem; padding: .4rem .8rem; cursor: pointer; }
.dock button:hover, .dock select:hover { border-color: var(--muted); }
.dock button:focus-visible, .dock select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dock button.primary { background: var(--accent); color: #0e1216; border-color: var(--accent); font-weight: 600; padding: .45rem 1.3rem; }
.dock button[hidden] { display: none; }
.dock .btns .run[disabled], .dock select[disabled] { opacity: .4; cursor: default; }
@media (max-width: 760px) { .dock .keys { display: none; } }
</style>
</head>
<body>

<div class="stage">
<div class="topbar"><span class="dot"></span><span>Loch Ness Monster analysis</span></div>

<div id="scroll"><div id="thread"></div></div>

<div class="composer-wrap">
  <div class="composer">
    <div class="txt" id="txt" data-ph="Ask anything"></div>
    <button class="send" id="send" aria-label="Send" tabindex="-1">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>
    </button>
  </div>
</div>

</div>

<div class="dock" id="dock">
  <div class="intro">
    <strong>Loch Ness analysis replay</strong>
    <span>Plays the prompt, the search steps and the full answer. Start your screen recording, then press Start.</span>
  </div>
  <div class="keys">Space pause / resume · R restart<br>E skip to end · Up / Down speed</div>
  <div class="btns">
    <button id="bStart" class="primary" type="button">Start</button>
    <button id="bPlay" class="run" type="button" disabled>Pause</button>
    <button id="bRestart" class="run" type="button" disabled>Restart</button>
    <button id="bSkip" type="button">Skip to end</button>
    <select id="sSpeed" aria-label="Speed">
      <option value="0.5">0.5x</option>
      <option value="0.75">0.75x</option>
      <option value="1" selected>1x</option>
      <option value="1.5">1.5x</option>
      <option value="2">2x</option>
      <option value="3">3x</option>
    </select>
  </div>
</div>

<script>
/* ---------- Content (edit here) ---------- */
/* The prompt and search queries are reconstructed: the saved chat held only the answer. */
const PROMPT = "Using the best available evidence you can, create three possible hypotheses for what the Loch Ness Monster is, and then use Analysis of Competing Hypotheses to rank them.";

const SEARCHES = [
  ["Loch Ness eDNA survey 2018 results", ""],
  ["Adrian Shine Loch Ness ship wakes sightings", ""],
  ["Loch Ness standing waves seiches explanation", ""],
  ["Loch Ness sightings register 2024", ""],
  ["Quest Loch Ness 2025 search results", ""],
  ["Surgeon's Photograph Spurling confession 1994", ""],
  ["Loch Ness 1933 Daily Mail Wetherell footprints", ""]
];

/* '@search' marks where the search steps run. Inline: **bold**, [text](url) */
const RESPONSE = [
  {t:"p", x:"I'll gather current evidence first (the 2018 eDNA survey, recent searches, and the history of the famous photos), then build the ACH matrix."},
  {t:"@search"},
  {t:"p", x:"Of the three, the best-supported explanation is that most sightings are known animals and natural phenomena that witnesses misread. Fabrication comes second, and a real, unrecognised animal ranks last. I built the ranking with Analysis of Competing Hypotheses (ACH), which scores each hypothesis by how much evidence contradicts it rather than how much supports it."},

  {t:"h2", x:"Hypotheses"},
  {t:"ul", items:[
    "**H1: An undiscovered animal.** A breeding population of a large unrecognised creature lives in the loch, such as a plesiosaur-like reptile or another unknown species.",
    "**H2: Misidentification.** Honest witnesses misread natural phenomena and known animals. These include boat wakes, standing waves, seiches, swimming deer, birds, seals, logs and unusually large eels.",
    "**H3: Fabrication and amplification.** Deliberate hoaxes, press and commercial incentives, and a self-reinforcing legend generate most of the sightings."
  ]},
  {t:"p", x:"These aren't fully exclusive in reality. Each is framed as the main driver of the body of sightings."},

  {t:"h2", x:"Evidence"},
  {t:"ul", items:[
    "**E1, eDNA survey.** The study detected over 500m individual organisms and 3,000 species, with no DNA matches for shark, catfish or sturgeon. The lead researcher said nothing remotely related to a plesiosaur showed up in the data. Eel DNA was abundant, so giant eels can't be ruled out. Eel DNA only shows that there are lots of eels, not that any are giant. Plenty of eel DNA doesn't confirm that Nessie is a giant eel. eDNA is also weaker at ruling out a rare or novel species.",
    "**E2, the \"Surgeon's Photograph\".** Christian Spurling confessed in 1994 to a plot involving both Marmaduke Wetherell and Colonel Wilson. A putty-covered toy submarine was made to look like Nessie.",
    "**E3, the 1933 surge.** The modern history of the monster began in 1933, when a new road along the north shore gave easy views of the water. The Daily Mail then sent Wetherell to find the creature, and he found huge footprints on the shore. The Mail later decided these were a hoax.",
    "**E4, natural explanations.** Adrian Shine, who has hunted Nessie for over 50 years, now attributes the sightings to ship wakes. Loch Ness Exploration's Alan McKenna points to standing waves, where two boat wakes of matching frequency meet. Shine also describes internal seiches that slosh back and forth for weeks.",
    "**E5, no physical or unambiguous evidence.** One zoologist's review concluded that the sightings, photos and sonar evidence can be explained as known animals, waves or optical illusions. The 2025 Quest search produced no new evidence, unlike earlier years.",
    "**E6, a declining sightings register.** Only three official sightings were registered in 2024, against 10 in 2023 and six in 2022. This is despite far more phones, drones and webcams.",
    "**E7, ecological viability.** This is my own inference, not something I retrieved. Ninety years of continuous sightings would need a breeding population of large animals in a cold, deep loch, and eDNA found no matching vertebrate group.",
    "**E8, thousands of sincere reports.** The sightings register holds 1,163 entries. Many come from apparently credible witnesses. Some individual cases have mundane explanations, such as the Spicers' 1933 sighting, which can be explained by a deer.",
    "**E9, pre-1933 folklore.** Reports go back to an Irish missionary's account of a monster in the River Ness in 565 AD. This has low diagnostic value, since all three hypotheses can absorb it.",
    "**E10, unexplained residuals.** A few sonar contacts and sightings were never conclusively explained. This is background knowledge, such as the 1987 sonar sweep Operation Deepscan, and I didn't verify it in this session."
  ]},

  {t:"h2", x:"ACH matrix"},
  {t:"p", x:"C = consistent, N = neutral, I = inconsistent, II = strongly inconsistent. Each I scores 1 point and each II scores 2. Fewer points means a better fit."},
  {t:"table",
   head:["Evidence (diagnosticity)","H1 Unknown animal","H2 Misidentification","H3 Fabrication"],
   rows:[
    ["E1 eDNA: no reptile or large fish, plenty of eels (high)","I","C","N"],
    ["E2 Surgeon's photo exposed (medium)","N","N","C"],
    ["E3 Surge after 1933 road and press (medium)","I","C","C"],
    ["E4 Wakes, seiches and standing waves match reports (medium)","N","C","N"],
    ["E5 No physical evidence in 90 years (high)","II","C","C"],
    ["E6 Registry sightings declining (low)","I","C","N"],
    ["E7 Ecology can't sustain a breeding population (high)","II","N","N"],
    ["E8 Thousands of sincere independent reports (high)","C","C","II"],
    ["E9 Folklore predating 1933 (low)","C","C","I"],
    ["E10 Unexplained residuals (low)","C","I","N"],
    ["Inconsistency score","7","1","3"]
   ]},

  {t:"h2", x:"Ranking"},
  {t:"ol", items:[
    "**H2, misidentification (score 1).** It contradicts none of the evidence apart from a few unresolved cases. It also explains the geography, the timing of the surge, and why modern cameras produce ambiguous shapes rather than a clear animal.",
    "**H3, fabrication and amplification (score 3).** It accounts for the most famous artefacts, the 1933 footprints and the 1934 photo. It fails as a general explanation because it can't account for thousands of sincere reports or the folklore that predates 1933.",
    "**H1, an undiscovered animal (score 7).** It is contradicted by the most diagnostic evidence: no eDNA signal for any plausible candidate, no bodies or bones, no clear imagery, and the biology of a breeding population. Its only support is the residual unexplained cases."
  ]},

  {t:"h2", x:"Caveats"},
  {t:"ul", items:[
    "**Sensitivity.** H1 stays last even if you drop E7, the one item that rests on my inference. H2 beats H3 mainly because of E8. If you discounted the volume of sincere witnesses, those two would tie.",
    "**Best-fit synthesis.** The hypotheses are mixed in practice. The most likely overall picture is H2 for the bulk of honest sightings, with H3 accounting for a few iconic hoaxes and the publicity around them.",
    "**Limits.** ACH ranks relative plausibility, not probabilities. Absence of eDNA is strong but not conclusive evidence, and a fringe tectonic-gas idea in the literature (Piccardi attributes some sightings to gas released by the fault under the loch) is untested."
  ]}
];

const TURNS = [
  { prompt: PROMPT, searches: SEARCHES, response: RESPONSE }
];

/* ---------- Timing (ms at 1x) ---------- */
const T = { char: 32, word: 40, wordSmall: 26, blockGap: 260, rowGap: 240 };

/* ---------- Engine ---------- */
const $ = (s) => document.querySelector(s);
const scroller = $("#scroll"), thread = $("#thread"), txt = $("#txt"), sendBtn = $("#send");
const ABORT = Symbol("abort");
let speed = 1, fastMode = false, fromTurn = 1, paused = false, skip = false, aborted = false, started = false, done = false, current = null;

const params = new URLSearchParams(location.search);
if (params.get("speed")) speed = Math.max(0.1, parseFloat(params.get("speed")) || 1);
fromTurn = Math.max(1, parseInt(params.get("from")) || 1);
if (params.get("zoom")) document.documentElement.style.fontSize = (18 * (parseFloat(params.get("zoom")) || 1)) + "px";
$("#sSpeed").value = String(speed);
if (![...$("#sSpeed").options].some(o => o.value === String(speed))) {
  const o = new Option(speed + "x", String(speed), true, true); $("#sSpeed").add(o);
}

function sleep(ms) {
  return new Promise((res, rej) => {
    let left = ms;
    (function tick() {
      if (aborted) return rej(ABORT);
      if (skip || fastMode) return res();
      if (paused) return void setTimeout(tick, 60);
      if (left <= 0) return res();
      const step = Math.min(left / speed, 20);
      setTimeout(() => { left -= step * speed; tick(); }, step);
    })();
  });
}
const jitter = (ms) => ms * (0.6 + Math.random() * 0.8);

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

/* Smooth auto-follow scrolling */
(function follow() {
  const target = scroller.scrollHeight - scroller.clientHeight;
  const d = target - scroller.scrollTop;
  if (Math.abs(d) > 0.5 && started && !done) scroller.scrollTop += (skip || fastMode) ? d : d * 0.14;
  requestAnimationFrame(follow);
})();

function parseInline(s) {
  const out = []; const re = /\*\*([^*]+)\*\*|\[([^\]]+)\]\(([^)]+)\)/g; let last = 0, m;
  while ((m = re.exec(s))) {
    if (m.index > last) out.push({ k: "t", text: s.slice(last, m.index) });
    if (m[1] != null) out.push({ k: "b", text: m[1] }); else out.push({ k: "a", text: m[2], href: m[3] });
    last = re.lastIndex;
  }
  if (last < s.length) out.push({ k: "t", text: s.slice(last) });
  return out;
}

async function streamInline(parent, str, wordMs) {
  parent.classList.add("cur");
  try {
    for (const seg of parseInline(str)) {
      let host = parent;
      if (seg.k === "b") { host = el("strong"); parent.appendChild(host); }
      else if (seg.k === "a") { host = el("a"); host.href = seg.href; host.target = "_blank"; host.rel = "noopener"; parent.appendChild(host); }
      const tn = document.createTextNode(""); host.appendChild(tn);
      for (const w of seg.text.split(/(\s+)/)) {
        if (!w) continue;
        tn.data += w;
        if (/\S/.test(w)) await sleep(jitter(wordMs));
      }
    }
  } finally { parent.classList.remove("cur"); }
}

/* ---------- Steps ---------- */
async function typePrompt(text) {
  txt.classList.add("cur");
  for (const ch of text) {
    txt.textContent += ch;
    await sleep(jitter(T.char) * (ch === " " ? 1.3 : 1));
  }
  txt.classList.remove("cur");
  sendBtn.classList.add("ready");
}

async function sendPrompt(text) {
  sendBtn.classList.add("press"); await sleep(160); sendBtn.classList.remove("press");
  const u = el("div", "msg user"); u.textContent = text; thread.appendChild(u);
  txt.textContent = ""; sendBtn.classList.remove("ready");
}

function addAssistant() {
  const m = el("div", "msg ai");
  m.appendChild(el("div", "avatar", "C"));
  const b = el("div", "body"); m.appendChild(b); thread.appendChild(m);
  return b;
}

async function thinking(body, ms) {
  const t = el("div", "thinking", "<i></i><i></i><i></i><span>Thinking</span>");
  body.appendChild(t); await sleep(ms); t.remove();
}

async function searches(body, list0) {
  const g = el("div", "tools");
  const head = el("div", "tools-head", '<span class="mark"></span><span class="lbl">Searching the web</span><span class="count"></span>');
  const list = el("div", "tools-list");
  g.append(head, list); body.appendChild(g);
  let n = 0, fails = 0;
  for (const [q, dom, status] of list0) {
    const row = el("div", "qrow", '<span class="mark"></span><span class="q"></span><span class="dom"></span>');
    row.querySelector(".q").textContent = q; row.querySelector(".dom").textContent = dom;
    list.appendChild(row);
    await sleep(jitter(820));
    if (status === "fail") { row.classList.add("fail"); fails++; } else row.classList.add("ok");
    n++;
    head.querySelector(".count").textContent = n + " / " + list0.length;
    await sleep(120);
  }
  head.classList.add("ok");
  head.querySelector(".lbl").textContent = "Searched the web";
  head.querySelector(".count").textContent = fails ? (n + " steps · " + fails + " blocked") : (n + " searches");
}

async function listBlock(body, tag, items) {
  const l = el(tag, "blk"); body.appendChild(l);
  for (const it of items) {
    const li = el("li"); l.appendChild(li);
    await streamInline(li, it, T.word);
    await sleep(T.blockGap * 0.6);
  }
}

async function tableBlock(body, b) {
  const wrap = el("div", "tablewrap blk"); const t = el("table");
  const thead = el("thead"); const hr = el("tr");
  b.head.forEach(h => hr.appendChild(el("th", null, h)));
  thead.appendChild(hr); t.appendChild(thead);
  const tbody = el("tbody"); t.appendChild(tbody); wrap.appendChild(t); body.appendChild(wrap);
  await sleep(500);
  for (const [i, row] of b.rows.entries()) {
    const isNew = !Array.isArray(row), r = isNew ? row.r : row;
    const q = b.fastOld && !isNew && i !== b.rows.length - 1 ? 0.3 : 1;
    const tr = el("tr", i === b.rows.length - 1 ? "sum" : (isNew ? "new" : "")); tbody.appendChild(tr);
    const ev = el("td", "ev"); ev.textContent = r[0]; tr.appendChild(ev);
    const cells = r.slice(1).map(v => {
      const td = el("td", "cell"); const m = /^(CC|II|C|I|N)\b(.*)$/.exec(v);
      if (m && i !== b.rows.length - 1) {
        const c = el("span", "code " + m[1].toLowerCase()); c.textContent = m[1]; td.appendChild(c);
        td.appendChild(document.createTextNode(m[2].trim()));
      } else td.textContent = v;
      tr.appendChild(td); return td;
    });
    requestAnimationFrame(() => ev.classList.add("show"));
    await sleep(T.rowGap * q);
    for (const td of cells) { td.classList.add("show"); await sleep(jitter(230) * q); }
    await sleep(T.rowGap * q * (isNew ? 2 : 1));
  }
}

async function block(body, b) {
  if (b.t === "p") { const p = el("p", "blk " + (b.cls || "")); body.appendChild(p); await streamInline(p, b.x, b.cls ? T.wordSmall : T.word); }
  else if (b.t === "h2") { const h = el("h2", "blk"); body.appendChild(h); await streamInline(h, b.x, T.wordSmall); }
  else if (b.t === "ul" || b.t === "ol") await listBlock(body, b.t, b.items);
  else if (b.t === "table") await tableBlock(body, b);
  await sleep(T.blockGap);
}

async function runTurn(turn, first, fast) {
  fastMode = fast;
  await sleep(first ? 700 : 1600);
  await typePrompt(turn.prompt);
  await sleep(500);
  await sendPrompt(turn.prompt);
  const body = addAssistant();
  await thinking(body, 1500);
  for (const b of turn.response) {
    if (b.t === "@search") { await searches(body, turn.searches); await thinking(body, 1000); }
    else await block(body, b);
  }
  fastMode = false;
}

async function run() {
  done = false; setPlayLabel();
  for (const [i, turn] of TURNS.entries()) await runTurn(turn, i === 0, i < fromTurn - 1);
  skip = false; done = true; setPlayLabel();
  document.body.dataset.state = "done";
}

/* ---------- Controls ---------- */
function setPlayLabel() { $("#bPlay").textContent = done ? "Replay" : (paused ? "Resume" : "Pause"); }

function resetDom() {
  thread.innerHTML = ""; txt.textContent = ""; txt.classList.remove("cur");
  sendBtn.classList.remove("ready", "press"); scroller.scrollTop = 0;
  document.body.dataset.state = "playing";
}

async function restart(keepSkip) {
  const wasSkip = keepSkip === true && skip;
  aborted = true;
  if (current) await current;
  aborted = false; skip = wasSkip; paused = false; started = true; done = false;
  $("#bStart").hidden = true; $("#bPlay").disabled = false; $("#bRestart").disabled = false;
  resetDom(); setPlayLabel();
  current = run().catch(e => { if (e !== ABORT) console.error(e); });
}

function begin() { if (!started) restart(true); }
function togglePause() { if (!started) return begin(); if (done) return restart(); paused = !paused; setPlayLabel(); }
function skipToEnd() { if (!started) { skip = true; return begin(); } if (!done) skip = true; }
function setSpeed(v) { speed = v; const s = $("#sSpeed"); if (![...s.options].some(o => o.value === String(v))) s.add(new Option(v + "x", String(v))); s.value = String(v); }
function stepSpeed(dir) {
  const vals = [...$("#sSpeed").options].map(o => parseFloat(o.value)).sort((a, b) => a - b);
  const i = vals.indexOf(speed); const n = Math.min(vals.length - 1, Math.max(0, (i < 0 ? vals.indexOf(1) : i) + dir)); setSpeed(vals[n]);
}

$("#bStart").addEventListener("click", begin);
$("#bPlay").addEventListener("click", togglePause);
$("#bRestart").addEventListener("click", () => restart());
$("#bSkip").addEventListener("click", skipToEnd);
$("#sSpeed").addEventListener("change", e => { speed = parseFloat(e.target.value); e.target.blur(); });

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === " ") { e.preventDefault(); togglePause(); }
  else if (k === "r") restart();
  else if (k === "e") skipToEnd();
  else if (e.key === "ArrowUp") { e.preventDefault(); stepSpeed(1); }
  else if (e.key === "ArrowDown") { e.preventDefault(); stepSpeed(-1); }
});

if (params.get("skip") === "1") skip = true;
if (params.get("autostart") === "1" || params.get("skip") === "1") begin();
</script>
