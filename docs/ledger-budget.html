<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Ledger — Budget</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --paper: #E9F1E5;
  --paper-deep: #DEEBD8;
  --rule: #AECBA5;
  --rule-soft: #C7DCC0;
  --ink: #1C3226;
  --ink-soft: #4B6156;
  --brass: #B9793B;
  --brass-deep: #94602B;
  --green: #2E6B49;
  --red: #A23F2E;
  --card: #F4F9F1;
  --shadow: rgba(28,50,38,0.14);
}

*{ box-sizing: border-box; }

body{
  margin:0;
  background: var(--paper);
  background-image:
    repeating-linear-gradient(var(--paper) 0 27px, var(--rule-soft) 27px 28px);
  color: var(--ink);
  font-family: 'IBM Plex Mono', monospace;
  min-height: 100vh;
}

.wrap{
  max-width: 1180px;
  margin: 0 auto;
  padding: 28px 24px 80px;
}

/* ---------- Header ---------- */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap: 20px;
  margin-bottom: 22px;
}

.brand{
  display:flex;
  align-items:center;
  gap: 12px;
}
.brand .ring{
  width: 34px; height:34px; border-radius:50%;
  background: radial-gradient(circle at 35% 30%, #D79B58, var(--brass-deep));
  box-shadow: inset 0 0 0 3px rgba(255,255,255,0.35), 0 1px 2px var(--shadow);
  flex-shrink:0;
}
.brand h1{
  font-family: 'Fraunces', serif;
  font-weight:600;
  font-size: 26px;
  letter-spacing: 0.2px;
  margin:0;
}
.brand p{
  margin:0;
  font-size:11px;
  color: var(--ink-soft);
  letter-spacing: 0.4px;
}

.month-nav{
  display:flex;
  align-items:center;
  gap: 10px;
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 6px 8px;
  box-shadow: 0 1px 2px var(--shadow);
}
.month-nav button{
  width: 26px; height:26px;
  border-radius:50%;
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--ink);
  cursor:pointer;
  font-family: inherit;
  font-size: 13px;
  display:flex; align-items:center; justify-content:center;
}
.month-nav button:hover{ background: var(--rule-soft); }
.month-nav .label{
  font-family:'Fraunces', serif;
  font-weight:500;
  font-size:15px;
  min-width: 150px;
  text-align:center;
}

.save-indicator{
  font-size: 10px;
  color: var(--ink-soft);
  letter-spacing: 0.5px;
  min-width: 70px;
  text-align:right;
}

.io-buttons{
  display:flex;
  gap: 8px;
}
.io-btn{
  border: 1px solid var(--rule);
  background: var(--card);
  color: var(--ink);
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size: 11.5px;
  letter-spacing:.2px;
  padding: 7px 12px;
  border-radius: 999px;
  cursor:pointer;
  box-shadow: 0 1px 2px var(--shadow);
}
.io-btn:hover{ background: var(--rule-soft); }

/* ---------- Summary strip ---------- */
.summary{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 26px;
}
.stat{
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: 10px;
  padding: 14px 16px;
  box-shadow: 0 1px 2px var(--shadow);
}
.stat .k{
  font-family:'Fraunces', serif;
  font-size: 12px;
  color: var(--ink-soft);
  margin-bottom: 4px;
}
.stat .v{
  font-size: 20px;
  font-weight: 600;
}
.stat .v.green{ color: var(--green); }
.stat .v.red{ color: var(--red); }
.stat .sub{ font-size: 10.5px; color: var(--ink-soft); margin-top:2px; }

/* ---------- Layout ---------- */
.grid{
  display:grid;
  grid-template-columns: 1.7fr 1fr;
  gap: 22px;
  align-items:start;
}
@media (max-width: 880px){
  .grid{ grid-template-columns: 1fr; }
}

/* ---------- Groups ---------- */
.group{
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: 10px;
  margin-bottom: 16px;
  overflow:hidden;
  box-shadow: 0 1px 2px var(--shadow);
}
.group-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding: 12px 16px;
  border-bottom: 2px double var(--rule);
  cursor:pointer;
  background: var(--paper-deep);
}
.group-head .gname{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size: 15px;
  display:flex;
  align-items:center;
  gap:8px;
}
.group-head .chev{
  display:inline-block;
  transition: transform .15s ease;
  color: var(--brass-deep);
  font-size:11px;
}
.group.collapsed .chev{ transform: rotate(-90deg); }
.group-head .totals{
  display:flex;
  gap: 22px;
  font-size: 12.5px;
}
.group-head .totals .col{ text-align:right; min-width:76px; }
.group-head .totals .lbl{ color: var(--ink-soft); font-size:9.5px; letter-spacing:.4px; }
.group-head .del-group{
  border:none; background:none; color: var(--ink-soft); cursor:pointer; font-size:13px; margin-left:10px;
}
.group-head .del-group:hover{ color: var(--red); }

.items{ padding: 4px 16px 10px; }
.group.collapsed .items{ display:none; }

.item-row{
  display:grid;
  grid-template-columns: 1fr 92px 90px 20px;
  align-items:center;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--rule-soft);
}
.item-row:last-child{ border-bottom:none; }
.item-name{ font-size: 13.5px; }
.item-name.clickable{ cursor:pointer; }
.item-name.clickable:hover{ color: var(--brass-deep); text-decoration: underline dotted; }
.item-row.active{
  background: var(--paper-deep);
  margin: 0 -10px;
  padding: 9px 10px;
  border-radius: 6px;
}
.item-bar{
  grid-column: 1 / 2;
  margin-top: 4px;
  height: 4px;
  background: var(--rule-soft);
  border-radius: 3px;
  overflow:hidden;
}
.item-bar > span{ display:block; height:100%; background: var(--green); }
.item-bar.over > span{ background: var(--red); }

.planned-input{
  width: 100%;
  text-align:right;
  border:none;
  background:transparent;
  color: var(--brass-deep);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  font-weight:600;
  border-bottom: 1px dashed transparent;
}
.planned-input:hover, .planned-input:focus{
  border-bottom: 1px dashed var(--brass);
  outline:none;
}
.remaining{
  text-align:right;
  font-size: 13px;
  font-weight:600;
}
.remaining.green{ color: var(--green); }
.remaining.red{ color: var(--red); }

.del-item{
  border:none; background:none; color: var(--rule); cursor:pointer; font-size:13px;
}
.del-item:hover{ color: var(--red); }

.add-row{
  display:flex;
  gap:8px;
  padding: 8px 0 4px;
}
.add-row input, .add-row select{
  font-family:'IBM Plex Mono', monospace;
  font-size:12.5px;
  border: 1px solid var(--rule);
  border-radius:6px;
  padding: 6px 8px;
  background: var(--paper);
  color: var(--ink);
}
.add-row input.name{ flex:1; }
.add-row input.amt{ width: 90px; text-align:right; }
.add-row button{
  border:none;
  border-radius:6px;
  background: var(--brass);
  color:#fff;
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:12.5px;
  padding: 6px 12px;
  cursor:pointer;
}
.add-row button:hover{ background: var(--brass-deep); }

.add-group-card{
  background: var(--card);
  border: 1px dashed var(--rule);
  border-radius: 10px;
  padding: 14px 16px;
}
.add-group-card .row{ display:flex; gap:8px; flex-wrap:wrap; }
.add-group-card input, .add-group-card select{
  font-family:'IBM Plex Mono', monospace;
  font-size:12.5px;
  border: 1px solid var(--rule);
  border-radius:6px;
  padding: 7px 9px;
  background: var(--paper);
}
.add-group-card input{ flex:1; min-width:140px; }
.add-group-card button{
  border:none; border-radius:6px; background: var(--ink); color:#fff;
  font-family:'Fraunces', serif; font-weight:600; font-size:12.5px; padding:7px 14px; cursor:pointer;
}

/* ---------- Transactions ---------- */
.panel{
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: 10px;
  box-shadow: 0 1px 2px var(--shadow);
  position: sticky;
  top: 20px;
}
.panel-head{
  padding: 14px 16px 10px;
  border-bottom: 2px double var(--rule);
}
.panel-head h2{
  font-family:'Fraunces', serif;
  font-size:15px;
  margin: 0 0 10px;
  font-weight:600;
}
.searchbox{
  display:flex;
  align-items:center;
  gap:6px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 6px 12px;
  background: var(--paper);
}

.filter-chip{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  background: var(--brass);
  color:#fff;
  border-radius: 999px;
  padding: 6px 10px 6px 12px;
  font-size: 11px;
  margin-bottom: 8px;
}
.filter-chip span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.filter-chip button{
  border:none; background: rgba(255,255,255,0.25); color:#fff;
  width:18px; height:18px; border-radius:50%; cursor:pointer; flex-shrink:0;
  font-size: 10px; line-height:1;
}
.filter-chip button:hover{ background: rgba(255,255,255,0.4); }
.searchbox input{
  border:none; background:transparent; font-family:'IBM Plex Mono', monospace; font-size:12.5px;
  width:100%; color: var(--ink);
}
.searchbox input:focus{ outline:none; }

.txn-list{
  max-height: 480px;
  overflow-y:auto;
  padding: 6px 6px;
}
.txn-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap: 8px;
  padding: 9px 10px;
  border-bottom: 1px solid var(--rule-soft);
}
.txn-row:last-child{ border-bottom:none; }
.txn-left .payee{ font-size:13px; font-weight:600; }
.txn-left .cat{ font-size: 10.5px; color: var(--brass-deep); margin-top:1px; }
.txn-left .note{ font-size: 10px; color: var(--ink-soft); margin-top:1px; }
.txn-right{ display:flex; align-items:center; gap:8px; }
.txn-amt{ font-size:13px; font-weight:600; white-space:nowrap; }
.txn-amt.green{ color: var(--green); }
.txn-amt.red{ color: var(--red); }
.txn-del{
  border:none; background:none; color: var(--rule); cursor:pointer; font-size:14px; opacity:0;
  transition: opacity .1s;
}
.txn-row:hover .txn-del{ opacity:1; }
.txn-del:hover{ color: var(--red); }

.empty-txns{
  padding: 26px 16px;
  text-align:center;
  color: var(--ink-soft);
  font-size:12.5px;
}

.panel-foot{
  padding: 12px 16px 14px;
  border-top: 1px solid var(--rule-soft);
}
.add-txn-btn{
  width:100%;
  border:none;
  border-radius:8px;
  background: var(--ink);
  color:#fff;
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:13px;
  padding: 10px;
  cursor:pointer;
}
.add-txn-btn:hover{ background: var(--green); }

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed; inset:0;
  background: rgba(20,32,25,0.4);
  display:flex; align-items:center; justify-content:center;
  z-index: 50;
  padding: 20px;
}
.modal{
  background: var(--card);
  border-radius: 12px;
  border: 1px solid var(--rule);
  width: 100%;
  max-width: 380px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}
.modal h3{
  font-family:'Fraunces', serif;
  margin: 0 0 14px;
  font-size: 17px;
}
.field{ margin-bottom: 12px; }
.field label{
  display:block;
  font-size: 10.5px;
  letter-spacing:.4px;
  color: var(--ink-soft);
  margin-bottom: 4px;
}
.field select, .field input{
  width:100%;
  font-family:'IBM Plex Mono', monospace;
  font-size: 13px;
  padding: 8px 10px;
  border: 1px solid var(--rule);
  border-radius: 7px;
  background: var(--paper);
  color: var(--ink);
}
.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap: 8px;
  margin-top: 16px;
}
.modal-actions button{
  border:none;
  border-radius:7px;
  padding: 9px 16px;
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size: 13px;
  cursor:pointer;
}
.btn-cancel{ background: transparent; color: var(--ink-soft); }
.btn-save{ background: var(--brass); color:#fff; }
.btn-save:hover{ background: var(--brass-deep); }

.section-add{ margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ---------------- Data helpers ---------------- */
const uid = () => Math.random().toString(36).slice(2,10);
const fmt = (n) => {
  const neg = n < 0;
  const v = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
  return (neg ? '-$' : '$') + v;
};
const monthLabel = (key) => {
  const [y,m] = key.split('-').map(Number);
  const d = new Date(y, m-1, 1);
  return d.toLocaleString('en-US', { month:'long', year:'numeric' });
};
const shiftMonth = (key, delta) => {
  const [y,m] = key.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
};

function defaultSeed(){
  return {
    groups: [
      { id: uid(), name: 'Income', type: 'income', items: [
        { id: uid(), name: 'Paycheck', planned: 0 }
      ]},
      { id: uid(), name: 'Giving', type: 'expense', items: [
        { id: uid(), name: 'Charity', planned: 0 }
      ]},
      { id: uid(), name: 'Savings', type: 'expense', items: [
        { id: uid(), name: 'Emergency Fund', planned: 0 }
      ]},
      { id: uid(), name: 'Housing', type: 'expense', items: [
        { id: uid(), name: 'Rent/Mortgage', planned: 0 },
        { id: uid(), name: 'Utilities', planned: 0 }
      ]},
      { id: uid(), name: 'Transportation', type: 'expense', items: [
        { id: uid(), name: 'Fuel/Transit', planned: 0 }
      ]},
      { id: uid(), name: 'Food', type: 'expense', items: [
        { id: uid(), name: 'Groceries', planned: 0 },
        { id: uid(), name: 'Restaurants', planned: 0 }
      ]},
      { id: uid(), name: 'Lifestyle', type: 'expense', items: [
        { id: uid(), name: 'Entertainment', planned: 0 },
        { id: uid(), name: 'Subscriptions', planned: 0 }
      ]},
    ],
    transactions: []
  };
}

/* ---------------- State ---------------- */
let currentMonth = (() => {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
})();
let state = { groups: [], transactions: [] };
let collapsedGroups = new Set();
let searchTerm = '';
let filterItemId = null;
let modalOpen = false;
let importPending = null; // { monthKeys, months }
let importErrorMsg = null;
let saveStatus = '';
let loaded = false;

const storeKey = (m) => 'ledger:' + m;

async function loadMonth(month){
  loaded = false;
  filterItemId = null;
  render();
  try{
    const res = await window.storage.get(storeKey(month));
    state = JSON.parse(res.value);
  }catch(e){
    // no data for this month — try previous month as a structural template
    try{
      const prev = await window.storage.get(storeKey(shiftMonth(month, -1)));
      const prevState = JSON.parse(prev.value);
      state = {
        groups: JSON.parse(JSON.stringify(prevState.groups)),
        transactions: []
      };
    }catch(e2){
      state = defaultSeed();
    }
    await persist();
  }
  loaded = true;
  render();
}

async function persist(){
  saveStatus = 'saving…';
  render();
  try{
    await window.storage.set(storeKey(currentMonth), JSON.stringify(state));
    saveStatus = 'saved';
  }catch(e){
    saveStatus = 'save failed';
  }
  render();
  setTimeout(() => { if(saveStatus!=='saving…'){ saveStatus=''; render(); } }, 1500);
}

/* ---------------- Mutations ---------------- */
function addGroup(name, type){
  if(!name.trim()) return;
  state.groups.push({ id: uid(), name: name.trim(), type, items: [] });
  persist();
}
function deleteGroup(gid){
  state.groups = state.groups.filter(g => g.id !== gid);
  state.transactions = state.transactions.filter(t => t.groupId !== gid);
  persist();
}
function addItem(gid, name, planned){
  if(!name.trim()) return;
  const g = state.groups.find(g=>g.id===gid);
  g.items.push({ id: uid(), name: name.trim(), planned: Number(planned)||0 });
  persist();
}
function deleteItem(gid, iid){
  const g = state.groups.find(g=>g.id===gid);
  g.items = g.items.filter(i=>i.id!==iid);
  state.transactions = state.transactions.filter(t => t.itemId !== iid);
  if(filterItemId === iid) filterItemId = null;
  persist();
}
function updatePlanned(gid, iid, value){
  const g = state.groups.find(g=>g.id===gid);
  const it = g.items.find(i=>i.id===iid);
  it.planned = Number(value) || 0;
  persist();
}
function addTransaction({ groupId, itemId, payee, note, amount, date }){
  state.transactions.unshift({ id: uid(), groupId, itemId, payee, note, amount: Number(amount), date });
  persist();
}
function deleteTransaction(tid){
  state.transactions = state.transactions.filter(t=>t.id!==tid);
  persist();
}

/* ---------------- Derived ---------------- */
function itemActual(itemId){
  return state.transactions.filter(t=>t.itemId===itemId).reduce((s,t)=>s+t.amount, 0);
}
function groupTotals(g){
  let planned = 0, actual = 0;
  g.items.forEach(it => { planned += it.planned; actual += itemActual(it.id); });
  return { planned, actual };
}
function summary(){
  let incomePlanned=0, incomeActual=0, expensePlanned=0, expenseActual=0;
  state.groups.forEach(g=>{
    const t = groupTotals(g);
    if(g.type==='income'){ incomePlanned+=t.planned; incomeActual+=t.actual; }
    else { expensePlanned+=t.planned; expenseActual+=(-t.actual); }
  });
  return { incomePlanned, incomeActual, expensePlanned, expenseActual, left: incomePlanned - expensePlanned };
}

/* ---------------- Rendering ---------------- */
function itemRowHTML(g, it){
  const actual = itemActual(it.id);
  let remaining, remClass, barPct, barOver;
  if(g.type === 'income'){
    remaining = actual - it.planned;
    remClass = remaining >= 0 ? 'green' : 'red';
    barPct = it.planned > 0 ? Math.min(100,(actual/it.planned)*100) : (actual>0?100:0);
    barOver = actual > it.planned && it.planned>0;
  } else {
    const spent = -actual;
    remaining = it.planned - spent;
    remClass = remaining >= 0 ? '' : 'red';
    barPct = it.planned > 0 ? Math.min(100,(spent/it.planned)*100) : (spent>0?100:0);
    barOver = spent > it.planned;
  }
  return `
    <div class="item-row ${filterItemId===it.id ? 'active' : ''}">
      <div>
        <div class="item-name clickable" onclick="filterByItem('${it.id}')" title="View transactions for this line item">${escapeHTML(it.name)}</div>
        <div class="item-bar ${barOver?'over':''}"><span style="width:${barPct}%"></span></div>
      </div>
      <input class="planned-input" type="number" step="0.01" value="${it.planned}"
        onchange="updatePlanned('${g.id}','${it.id}', this.value)" />
      <div class="remaining ${remClass}">${fmt(remaining)}</div>
      <button class="del-item" title="Delete line item" onclick="deleteItem('${g.id}','${it.id}')">✕</button>
    </div>`;
}

function groupHTML(g){
  const totals = groupTotals(g);
  const collapsed = collapsedGroups.has(g.id);
  return `
  <div class="group ${collapsed?'collapsed':''}">
    <div class="group-head" onclick="toggleGroup('${g.id}')">
      <div class="gname"><span class="chev">▾</span>${escapeHTML(g.name)}</div>
      <div style="display:flex;align-items:center;">
        <div class="totals">
          <div class="col"><div class="lbl">PLANNED</div>${fmt(totals.planned)}</div>
          <div class="col"><div class="lbl">${g.type==='income'?'RECEIVED':'REMAINING'}</div>${fmt(g.type==='income'?totals.actual:(totals.planned+totals.actual))}</div>
        </div>
        <button class="del-group" title="Delete category" onclick="event.stopPropagation(); deleteGroup('${g.id}')">✕</button>
      </div>
    </div>
    <div class="items">
      ${g.items.map(it=>itemRowHTML(g,it)).join('') || '<div style="padding:10px 0;color:var(--ink-soft);font-size:12.5px;">No line items yet.</div>'}
      <div class="add-row">
        <input class="name" placeholder="Add line item…" id="newitem-${g.id}" onkeydown="if(event.key==='Enter'){submitAddItem('${g.id}')}" />
        <input class="amt" placeholder="0.00" id="newamt-${g.id}" onkeydown="if(event.key==='Enter'){submitAddItem('${g.id}')}" />
        <button onclick="submitAddItem('${g.id}')">Add</button>
      </div>
    </div>
  </div>`;
}

function txnRowHTML(t){
  const item = state.groups.flatMap(g=>g.items.map(i=>({...i, gname:g.name, gtype:g.type}))).find(i=>i.id===t.itemId);
  const catLabel = item ? item.gname + ' · ' + item.name : '(deleted category)';
  const isPositive = t.amount >= 0;
  return `
    <div class="txn-row">
      <div class="txn-left">
        <div class="payee">${escapeHTML(t.payee)}</div>
        <div class="cat">${escapeHTML(catLabel)}</div>
        ${t.note ? `<div class="note">${escapeHTML(t.note)}</div>` : ''}
      </div>
      <div class="txn-right">
        <div class="txn-amt ${isPositive?'green':'red'}">${fmt(t.amount)}</div>
        <button class="txn-del" onclick="deleteTransaction('${t.id}')" title="Delete">✕</button>
      </div>
    </div>`;
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  const app = document.getElementById('app');
  if(!loaded){
    app.innerHTML = `<div style="padding:80px;text-align:center;color:var(--ink-soft);font-size:13px;">Opening the ledger…</div>`;
    return;
  }
  const s = summary();
  const allItems = state.groups.flatMap(g=>g.items.map(i=>({...i, gname:g.name, gtype:g.type})));
  const filteredItem = filterItemId ? allItems.find(i=>i.id===filterItemId) : null;
  const filteredTxns = state.transactions.filter(t=>{
    if(filterItemId && t.itemId !== filterItemId) return false;
    if(!searchTerm) return true;
    const hay = (t.payee + ' ' + (t.note||'')).toLowerCase();
    return hay.includes(searchTerm.toLowerCase());
  });

  app.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="ring"></div>
        <div>
          <h1>Ledger</h1>
          <p>A HOME BUDGET, KEPT PLAINLY</p>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <div class="save-indicator">${saveStatus}</div>
        <div class="io-buttons">
          <button class="io-btn" onclick="exportData()">Export</button>
          <button class="io-btn" onclick="document.getElementById('import-file').click()">Import</button>
          <input type="file" id="import-file" accept="application/json" style="display:none" onchange="handleImportFile(event)" />
        </div>
        <div class="month-nav">
          <button onclick="changeMonth(-1)">‹</button>
          <div class="label">${monthLabel(currentMonth)}</div>
          <button onclick="changeMonth(1)">›</button>
        </div>
      </div>
    </div>

    <div class="summary">
      <div class="stat">
        <div class="k">Income</div>
        <div class="v">${fmt(s.incomeActual)}</div>
        <div class="sub">planned ${fmt(s.incomePlanned)}</div>
      </div>
      <div class="stat">
        <div class="k">Budgeted</div>
        <div class="v">${fmt(s.expensePlanned)}</div>
        <div class="sub">spent ${fmt(s.expenseActual)}</div>
      </div>
      <div class="stat">
        <div class="k">Left to Budget</div>
        <div class="v ${s.left===0?'green':(s.left<0?'red':'')}">${fmt(s.left)}</div>
        <div class="sub">${s.left===0 ? 'every dollar has a job' : (s.left>0 ? 'still unallocated' : 'over-allocated')}</div>
      </div>
    </div>

    <div class="grid">
      <div>
        ${state.groups.map(groupHTML).join('')}
        <div class="add-group-card section-add">
          <div class="row">
            <input id="newgroupname" placeholder="New category name…" />
            <select id="newgrouptype">
              <option value="expense">Expense</option>
              <option value="income">Income</option>
            </select>
            <button onclick="submitAddGroup()">Add category</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Transactions</h2>
          ${filterItemId ? `
            <div class="filter-chip">
              <span>Showing: ${filteredItem ? escapeHTML(filteredItem.gname + ' · ' + filteredItem.name) : '(deleted line item)'}</span>
              <button onclick="clearItemFilter()" title="Clear filter">✕</button>
            </div>
          ` : ''}
          <div class="searchbox">
            <span>🔍</span>
            <input placeholder="Search payee or note…" value="${escapeHTML(searchTerm)}" oninput="onSearch(this.value)" />
          </div>
        </div>
        <div class="txn-list">
          ${filteredTxns.length ? filteredTxns.map(txnRowHTML).join('') : `<div class="empty-txns">${filterItemId ? 'No transactions booked against this line item yet.' : 'No transactions yet.<br/>Add one to book it against a budget.'}</div>`}
        </div>
        <div class="panel-foot">
          <button class="add-txn-btn" onclick="openModal()">+ Add transaction</button>
        </div>
      </div>
    </div>

    ${modalOpen ? modalHTML() : ''}
    ${importPending ? importConfirmHTML() : ''}
    ${importErrorMsg ? importErrorHTML() : ''}
  `;
}

function importConfirmHTML(){
  const keys = importPending.monthKeys;
  return `
  <div class="modal-backdrop">
    <div class="modal">
      <h3>Import data?</h3>
      <p style="font-size:12.5px; color:var(--ink-soft); line-height:1.5;">
        This file has ${keys.length} month${keys.length===1?'':'s'} of data. Importing will
        <strong>overwrite</strong> any existing data for the same month(s):
      </p>
      <ul style="font-size:12.5px; margin:0 0 14px; padding-left:18px; color:var(--ink);">
        ${keys.map(m => `<li>${escapeHTML(m)}</li>`).join('')}
      </ul>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="cancelImport()">Cancel</button>
        <button class="btn-save" onclick="confirmImport()">Import</button>
      </div>
    </div>
  </div>`;
}

function importErrorHTML(){
  return `
  <div class="modal-backdrop">
    <div class="modal">
      <h3>Couldn't import that file</h3>
      <p style="font-size:12.5px; color:var(--ink-soft); line-height:1.5;">${escapeHTML(importErrorMsg)}</p>
      <div class="modal-actions">
        <button class="btn-save" onclick="importErrorMsg=null; render();">OK</button>
      </div>
    </div>
  </div>`;
}

function modalHTML(){
  const options = state.groups.map(g =>
    `<optgroup label="${escapeHTML(g.name)}">${g.items.map(i=>`<option value="${i.id}" data-type="${g.type}" data-gid="${g.id}">${escapeHTML(i.name)}</option>`).join('')}</optgroup>`
  ).join('');
  const today = new Date().toISOString().slice(0,10);
  return `
  <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h3>Book a transaction</h3>
      <div class="field">
        <label>CATEGORY</label>
        <select id="txn-item">${options}</select>
      </div>
      <div class="field">
        <label>PAYEE / SOURCE</label>
        <input id="txn-payee" placeholder="e.g. Trader Joe's" />
      </div>
      <div class="field">
        <label>AMOUNT</label>
        <input id="txn-amount" type="number" step="0.01" placeholder="0.00" />
      </div>
      <div class="field">
        <label>DATE</label>
        <input id="txn-date" type="date" value="${today}" />
      </div>
      <div class="field">
        <label>NOTE (OPTIONAL)</label>
        <input id="txn-note" placeholder="" />
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-save" onclick="submitTransaction()">Book it</button>
      </div>
    </div>
  </div>`;
}

/* ---------------- UI event handlers ---------------- */
function toggleGroup(gid){
  if(collapsedGroups.has(gid)) collapsedGroups.delete(gid); else collapsedGroups.add(gid);
  render();
}
function changeMonth(delta){
  currentMonth = shiftMonth(currentMonth, delta);
  loadMonth(currentMonth);
}
function onSearch(v){ searchTerm = v; render(); }
function filterByItem(itemId){
  filterItemId = (filterItemId === itemId) ? null : itemId;
  render();
}
function clearItemFilter(){
  filterItemId = null;
  render();
}
function submitAddGroup(){
  const nameEl = document.getElementById('newgroupname');
  const typeEl = document.getElementById('newgrouptype');
  addGroup(nameEl.value, typeEl.value);
}
function submitAddItem(gid){
  const nameEl = document.getElementById('newitem-'+gid);
  const amtEl = document.getElementById('newamt-'+gid);
  addItem(gid, nameEl.value, amtEl.value);
}
function openModal(){ modalOpen = true; render(); }
function closeModal(){ modalOpen = false; render(); }
function submitTransaction(){
  const itemEl = document.getElementById('txn-item');
  const selected = itemEl.options[itemEl.selectedIndex];
  if(!selected) return;
  const itemId = selected.value;
  const groupId = selected.getAttribute('data-gid');
  const gtype = selected.getAttribute('data-type');
  const payee = document.getElementById('txn-payee').value.trim() || '(unnamed)';
  const note = document.getElementById('txn-note').value.trim();
  const date = document.getElementById('txn-date').value;
  let amount = Number(document.getElementById('txn-amount').value) || 0;
  if(gtype === 'expense' && amount > 0) amount = -amount;
  if(gtype === 'income' && amount < 0) amount = -amount;
  addTransaction({ groupId, itemId, payee, note, amount, date });
  modalOpen = false;
  render();
}

/* ---------------- Import / Export ---------------- */
async function exportData(){
  saveStatus = 'exporting…';
  render();
  try{
    // make sure the month currently open is flushed first
    await window.storage.set(storeKey(currentMonth), JSON.stringify(state));

    const listRes = await window.storage.list('ledger:');
    const keys = (listRes && listRes.keys) ? listRes.keys : [];
    const bundle = {};
    for(const key of keys){
      try{
        const res = await window.storage.get(key);
        const month = key.replace(/^ledger:/, '');
        bundle[month] = JSON.parse(res.value);
      }catch(e){ /* skip unreadable key */ }
    }

    const payload = {
      app: 'ledger-budget',
      exportedAt: new Date().toISOString(),
      months: bundle
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ledger-budget-export-${currentMonth}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    saveStatus = 'exported';
  }catch(e){
    saveStatus = 'export failed';
  }
  render();
  setTimeout(() => { saveStatus=''; render(); }, 1800);
}

function handleImportFile(event){
  const file = event.target.files[0];
  event.target.value = ''; // allow re-selecting the same file later
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let payload;
    try{
      payload = JSON.parse(reader.result);
    }catch(e){
      importErrorMsg = 'That file is not valid JSON.';
      render();
      return;
    }
    const months = payload && payload.months ? payload.months : null;
    if(!months || typeof months !== 'object' || Object.keys(months).length === 0){
      importErrorMsg = 'This file does not look like a Ledger export.';
      render();
      return;
    }
    importPending = { monthKeys: Object.keys(months), months };
    render();
  };
  reader.onerror = () => {
    importErrorMsg = 'Could not read that file.';
    render();
  };
  reader.readAsText(file);
}

function cancelImport(){
  importPending = null;
  render();
}

async function confirmImport(){
  if(!importPending) return;
  const { monthKeys, months } = importPending;
  importPending = null;
  saveStatus = 'importing…';
  render();
  try{
    for(const month of monthKeys){
      await window.storage.set(storeKey(month), JSON.stringify(months[month]));
    }
    saveStatus = 'imported';
    await loadMonth(currentMonth); // refresh view, picks up new data if current month was included
  }catch(e){
    saveStatus = 'import failed';
  }
  render();
  setTimeout(() => { saveStatus=''; render(); }, 1800);
}

/* ---------------- Boot ---------------- */
loadMonth(currentMonth);
</script>
